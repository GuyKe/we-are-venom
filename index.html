<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>WE ARE VENOM</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    #app {
      position: fixed;
      inset: 0;
    }
    #intro {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #eaeaea;
      background: radial-gradient(ellipse at center, #10131a 0%, #000000 80%);
      text-align: center;
      z-index: 10;
      transition: opacity 0.6s ease;
    }
    #intro h1 {
      font-size: 3rem;
      letter-spacing: 0.35em;
      margin: 0 0 0.5rem 0;
      color: #f2f2f2;
      text-shadow: 0 0 18px rgba(255,255,255,0.55), 0 0 40px rgba(120,180,255,0.35);
    }
    #intro p {
      max-width: 34rem;
      line-height: 1.5;
      color: #9aa4b2;
      margin: 0.35rem 0;
    }
    #intro.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="intro">
    <h1>WE ARE VENOM</h1>
    <p>A living symbiote has bonded to your arms. Smash the drifting orbs before they touch the ground.</p>
    <p>Put on your headset and press <strong>Enter VR</strong> below, or click anywhere here to preview the arena on desktop.</p>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
